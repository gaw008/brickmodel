<text x="44.00" y="669.00" font-size="14" >30 个有效系列，90 片饱水试件；温度离散取样，不插值。</text>
<text x="44.00" y="694.00" font-size="14" >气氛、升温速率、保温时长未确认；小圆片不是整砖；吸水率不能替代强度认证。</text>
